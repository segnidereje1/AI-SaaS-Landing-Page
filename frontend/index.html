<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />
    <title>Aurelia - Luxury AI Experience</title>
    <meta
      name="description"
      content="A luxurious AI landing page with an editorial visual system, built with React, Tailwind CSS, and Framer Motion."
    />
    <meta property="og:title" content="Aurelia - Luxury AI Experience" />
    <meta
      property="og:description"
      content="A luxurious AI landing page with an editorial visual system, built with React, Tailwind CSS, and Framer Motion."
    />
    <script>
      (() => {
        document.documentElement.classList.add('dark')
        const themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) {
          themeColor.setAttribute('content', '#050816')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
